<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Essay Tracker</title>
<meta name="description" content="Track college applications, essays and deadlines." />
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Essay Tracker</h1>
      <div class="sub" id="todayLine">loading</div>
    </div>
    <div class="actions">
      <button class="btn" id="addSchoolBtn">Add school</button>
      <button class="btn" id="exportBtn">Export</button>
      <button class="btn" id="importBtn">Import</button>
      <input type="file" id="fileIn" accept="application/json" hidden />
      <button class="btn" id="csvBtn">CSV</button>
      <button class="btn" id="resetBtn">Reset</button>
    </div>
  </header>

  <div class="progress"><span id="progText">0/0 essays</span><span id="progPct">0%</span></div>
  <div class="track"><i id="progBar"></i></div>
  <div class="next" id="nextLine"></div>

  <div class="controls">
    <input type="search" id="q" placeholder="Search" />
    <select id="fCat">
      <option value="">All regions</option>
      <option value="US-RD">US — Regular</option>
      <option value="US-EA">US — Early</option>
      <option value="CA-US">UC / USC</option>
      <option value="Canada">Canada</option>
      <option value="Intl">International</option>
    </select>
    <select id="fStatus">
      <option value="">All statuses</option>
      <option>Not started</option>
      <option>In progress</option>
      <option>Essays done</option>
      <option>Pending approval</option>
      <option>Submitted</option>
    </select>
    <select id="fSort">
      <option value="deadline">Deadline</option>
      <option value="progress">Least progress</option>
      <option value="name">A–Z</option>
    </select>
    <label class="checkline"><input type="checkbox" id="hideDone" /> hide submitted</label>
  </div>

  <div id="schools"></div>

  <footer>Autosaves in this browser. Export weekly as backup. Double-click an essay to rename it.</footer>
</div>

<dialog id="dlg">
  <h3>Add school</h3>
  <label>Name</label><input id="nName" placeholder="e.g. Duke University" />
  <label>Region</label>
  <select id="nCat">
    <option value="US-RD">US — Regular</option>
    <option value="US-EA">US — Early</option>
    <option value="CA-US">UC / USC</option>
    <option value="Canada">Canada</option>
    <option value="Intl">International</option>
  </select>
  <label>Deadline</label><input id="nDate" type="date" value="2027-01-01" />
  <label>Essays (comma separated)</label><input id="nEssays" placeholder="Why Us (250w), Community (300w)" />
  <div style="margin-top:16px;text-align:right">
    <button class="btn" id="dlgCancel">Cancel</button>
    <button class="btn" id="dlgSave"><strong>Add</strong></button>
  </div>
</dialog>

<script src="./app.js"></script>
</body>
</html>
